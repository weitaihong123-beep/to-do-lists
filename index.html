<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>待办todo</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <input type="text" id="input">
    <button type="button" id="add">add</button>
    <ul id="ul">
    </ul>
    <script>
        let input = document.getElementById("input");
        let add = document.getElementById("add");
        let ul = document.getElementById("ul")
        let todolist = [];
        add.onclick = function () {
            if (input.value === "") {
                alert("请输入文本")
            }
            else {
                todolist.push({ thing: input.value, status: false })
                localStorage.setItem("todolist", JSON.stringify(todolist))

            }
            /*localstorage存的是键值对，但是值如果是属性，那么键要怎么命名不重复呢？
            为什么一定要单个单个存呢，直接把todolist作为值不就好了。
            有什么办法监测todolist的状态变化呢？
            现在做法是增加存一下，删减存一下，状态变化存一下
            下一步是取出：取出是把仓库给到todolist，所以末尾先加一个函数，这样加载的时候就能把数据传过去
            
            */
            render()



        };
        let render = function () {
            ul.textContent = "";
            todolist.forEach((item, i) => {
                let li = document.createElement("li")

                let finish = document.createElement("button")
                finish.textContent = "完成"
                let deleteitem = document.createElement("button")
                deleteitem.textContent = "删除"
                li.textContent = item.thing
                li.append(finish, deleteitem)
                finish.onclick = () => {
                    item.status = true;
                    localStorage.setItem("todolist", JSON.stringify(todolist))
                    render();
                    console.log(todolist)

                }
                deleteitem.onclick = () => {
                    todolist.splice(i, 1);
                    localStorage.setItem("todolist", JSON.stringify(todolist))
                    render();

                }
                if (item.status === true) {
                    li.style.backgroundColor = '#f0f0f0';

                }

                ul.append(li)
            })



        };
        (() => {
            let store = localStorage.getItem("todolist")
            if (store){
            todolist = JSON.parse(store)
            }
            render()
        })()
        /*
        呃，怎么添加功能都用不了了，是不是要等到页面刷新的时候再来赋值
        为什么74行不写分号会报错，然后怎么影响到添加功能不能使用，等下了解分号机制
        */

    </script>
</body>

</html>
